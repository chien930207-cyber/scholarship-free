<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上線檢查</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f3;color:#203e34;font:16px/1.8 system-ui,"Microsoft JhengHei",sans-serif}header{background:#1c5745;color:white;padding:24px max(22px,calc((100vw - 1050px)/2))}header b{letter-spacing:.06em}main{max-width:1050px;margin:26px auto;padding:0 20px 70px}section{background:white;border:1px solid #dce7dc;border-radius:16px;padding:25px 30px;margin:20px 0}h1{font-size:32px;line-height:1.35;margin:0 0 10px}h2{font-size:24px;line-height:1.4;margin:0 0 16px}h3{font-size:18px;margin-top:24px}p{margin:12px 0}a{color:#236a51;overflow-wrap:anywhere}header a{color:white}table{width:100%;border-collapse:collapse;margin:18px 0;font-size:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2eae1;vertical-align:top;overflow-wrap:anywhere}th{background:#f0f6ee}code{font-family:ui-monospace,monospace;font-size:.88em;background:#eff5ed;padding:3px 5px;border-radius:4px;overflow-wrap:anywhere}ol{padding-left:25px}li{margin:8px 0}.note{border-left:4px solid #d59929;background:#fff7e6;padding:13px 18px;border-radius:4px}.ok{border-left-color:#247259;background:#edf6ee}.steps{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}.steps a{background:#e6f1e5;padding:6px 12px;border-radius:7px;text-decoration:none;font-size:14px}button{font:inherit;font-size:13px;border:1px solid #b8cfbb;background:#f2f7f0;color:#236149;border-radius:6px;cursor:pointer;padding:5px 11px;margin-left:8px}textarea{width:100%;height:300px;font:12px/1.5 monospace;white-space:pre;background:#173e31;color:#edfaee;border:0;border-radius:8px;padding:16px}summary{cursor:pointer;font-weight:650;padding:8px 0}.small{font-size:13px;color:#637468}.tag{display:inline-block;background:#e7f3e6;color:#206440;padding:4px 9px;border-radius:6px;font-size:13px}.bad{background:#fff0e7;color:#924921}.muted{background:#f0f1ef;color:#616a60}input[type=checkbox]{width:18px;height:18px;vertical-align:middle}footer{text-align:center;font-size:13px;color:#6b7b6d;margin:28px}@media(max-width:650px){h1{font-size:26px}h2{font-size:21px}section{padding:20px 17px}main{padding:0 12px}td,th{padding:9px;font-size:13px}}</style></head><body><header><b>FREE 14 / 上線檢查</b></header><main><section><h1>網站能開，還要確認服務真的有執行</h1><p>先到 GitHub Actions → Collect and verify → Run workflow，Mode 選 <b>verify</b>。</p><button id="refresh">重新檢查</button> <a href="/">回網站</a> · <a href="/help.html">上架教學</a><div id="main"></div></section><section><h2>最近一次真實驗證</h2><div id="tests">尚未讀取</div></section><section><h2>每日更新</h2><div id="daily"></div><p class="small">部分完成不等於全部來源已讀取。不要只看 Actions 綠色就認定全網更新完畢。</p></section></main><script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={'Database read':'資料庫讀取','Database write':'資料庫寫入與讀回','Live Tavily search':'真實 Tavily 搜尋','Live Workers AI':'真實 Workers AI','Live official source':'官方公告取得','GitHub job dispatch':'GitHub 背景工作啟動'};
async function run(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json();$('main').innerHTML='<p>程式版本：<b>'+esc(s.appVersion)+'</b> · 排程：'+esc(s.scheduler?.localTime||'未設定')+'</p><p>最近背景工作：'+esc(s.lastRunnerAt||'尚無執行紀錄')+'</p>';const d=s.diagnostics||{};$('tests').innerHTML=d.checks?.length?'<p>'+esc(d.at)+'</p><table>'+d.checks.map(c=>'<tr><td>'+esc(names[c.name]||c.name)+'</td><td><span class="tag '+(c.ok?'':'bad')+'">'+(c.ok?'PASS':'FAIL')+'</span></td><td>'+esc(c.detail)+'</td></tr>').join('')+'</table>':'<p class="note">尚未執行 verify，不代表外部服務已成功。</p>';const x=s.daily||{},c=x.counts||{};$('daily').innerHTML='<p>狀態：'+esc(x.status||'尚未執行')+'</p><p>上次開始：'+esc(x.lastAttemptAt||'無')+'<br>上次結束：'+esc(x.lastFinishedAt||'無')+'</p><p>成功讀取 '+esc(c.pagesSucceeded??0)+' / '+esc(c.pagesAttempted??0)+' 頁 · 新增 '+esc(c.added??0)+' 筆 · 更新 '+esc(c.updated??0)+' 筆 · 完成自動條件 '+esc(c.autoReady??0)+' 筆</p><details><summary>本批未完成原因</summary><pre>'+esc(JSON.stringify(x.errors||[],null,2))+'</pre></details>';}catch(e){$('main').textContent='未連上後端。請從已部署的 workers.dev 網址開啟，不是離線 HTML。';}}
$('refresh').onclick=run;run();
</script></body></html>
